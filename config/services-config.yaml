# Central vulnerability remediation configuration for all Infoblox Go services
# This file defines service-specific build flags, Docker configuration, and risk scoring parameters.
#
# Each service section must include all required fields or inherit from defaults.
# Reference: https://github.com/Infoblox-CTO/ddi.ai.agents
#
# Required fields per service:
#   - image_name: Docker image name for scanning
#   - dockerfile_path: Relative path to Dockerfile
#   - server_build_path: Relative path to main package (e.g., ./cmd/server)
#   - base_image: Base image digest or tag
#   - mode: Risk scoring mode (heuristic)
#
# Optional fields (if omitted, script defaults apply where defined):
#   - build_tags, build_ldflags, docker_build_extra_args
#   - go_private: Private module import path patterns
#   - risk_threshold_auto, risk_threshold_review, min_confidence, etc.

# ═══════════════════════════════════════════════════════════════════════════════
# GLOBAL SETTINGS (applies to all services)
# ═══════════════════════════════════════════════════════════════════════════════
global:
  wiz_cli_version: "latest"
  harbor_registry: "harbor.services.sdp.infoblox.com"
  artifact_retention_days: 30

services:

  cdc-syslog-out:
    team: data-cdc
    image_name: cdc-syslog-out
    dockerfile_path: docker/Dockerfile.cloud
    server_build_path: ./cmd/cloud
    build_tags: ""
    build_ldflags: ""
    docker_build_extra_args: ""
    base_image: "harbor.services.sdp.infoblox.com/infobloxcto/static-debian12:v2025.6.27-nonroot-627d6c"
    go_private: "github.com/Infoblox-CTO/*"
    # Risk scoring (conservative: auto-apply high-confidence patches only)
    mode: "heuristic"
    risk_threshold_auto: 0.85
    risk_threshold_review: 0.90
    min_confidence: 0.70
    confidence: 0.75
    exploit_weight: 0.40
    version_weight: 0.35
    cycle_weight: 0.25

  cdc-grpc-in:
    team: "cdc-team"
    image_name: "cdc-grpc-in"
    dockerfile_path: "docker/Dockerfile.cloud"
    server_build_path: "./cmd/cloud"
    base_image: "harbor.services.sdp.infoblox.com/infobloxcto/static-debian12:v2025.6.27-nonroot-627d6c"
    build_tags: ""
    build_ldflags: "-s -w"
    docker_build_extra_args: ""
    go_private: ""
    docker_build_context: "."
    working_directory: "."
    mode: "heuristic"
    risk_threshold_auto: 0.85
    risk_threshold_review: 0.90
    min_confidence: 0.70
    confidence: 0.75
    exploit_weight: 0.40
    version_weight: 0.35
    cycle_weight: 0.25
    policy:
      auto_apply: [patch, minor]
      max_minor_jump: 20
      never: [major, stdlib]
      require_build_pass: true