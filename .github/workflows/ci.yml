# CI for the package itself.
#
# The predecessor had none — no shellcheck, no config lint, no tests. That is
# how a `reasons` array leaked across loop iterations, an EXIT trap silently
# clobbered the exit status, `bc` became an undeclared dependency, and a risk
# model that classified everything identically shipped to 105 services.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint scripts (errors fail the build)
        run: |
          # SC1091: sourced config isn't followed across files.
          # SC2016: fires on awk program text, which is single-quoted on purpose.
          shellcheck --severity=error --exclude=SC1091,SC2016 scripts/*.sh tests/*.sh

      - name: Report warnings (informational)
        # Warnings are surfaced but do not fail: the remaining ones are unused
        # read-placeholder variables in the ported scripts. Errors are the gate.
        continue-on-error: true
        run: |
          shellcheck --severity=warning --exclude=SC1091,SC2016 scripts/*.sh tests/*.sh \
            || echo "::notice::shellcheck warnings above are informational" 

  config:
    name: config lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validator
        run: pip install --quiet jsonschema pyyaml
      - name: Validate the bundled snapshot against the schema
        run: bash scripts/lint-config.sh config/services-config.yaml

  tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        run: |
          YQ_VERSION=v4.44.3
          sudo wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
      - name: Run tests
        run: bash tests/run-tests.sh

  action:
    name: action metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML parses
        run: |
          pip install --quiet pyyaml
          # A malformed action.yml only surfaces when a consumer's workflow
          # fails, in their repo, on their schedule — check it here instead.
          python3 - <<'PY'
          import sys, yaml
          for path in ("action.yml",
                       ".github/workflows/vuln-autofix-reusable.yml",
                       ".github/workflows/ci.yml"):
              with open(path) as fh:
                  yaml.safe_load(fh)
              print(f"OK  {path}")

          action = yaml.safe_load(open("action.yml"))
          assert action["runs"]["using"] == "composite", "must stay a composite action"
          # Every step that runs shell must declare it; a missing `shell:` is a
          # composite-action-only requirement and easy to forget.
          for step in action["runs"]["steps"]:
              if "run" in step and "shell" not in step:
                  sys.exit(f"step '{step.get('name')}' has run: but no shell:")
          print("OK  composite action steps declare a shell")
          PY
